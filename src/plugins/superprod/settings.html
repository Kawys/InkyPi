<button type="button" onclick="openModal('spModal'); getState();" class="action-button compact">Open global settings</button>

<div class="form-group">
  <div class="form-group nowrap">
    <label for="title" class="form-label">Title</label>
    <input type="text" id="title" name="title" placeholder="Type something..." class="form-input">
  </div>
  <div class="form-group nowrap">
    <label for="listStyle" class="form-label">List Style:</label>
    <select id="listStyle" name="listStyle" class="form-input">
      <option value="disc">Disc (●)</option>
      <option value="square">Square (◼)</option>
      <option value="'\25C6  '">Diamond (◆)</option>
      <option value="decimal">Decimal</option>
      <option value="lower-roman">Roman Numeral</option>
      <option value="lower-alpha">Alphabetical</option>
    </select>
  </div>
  <div class="form-group nowrap">
    <label for="fontSize" class="form-label">Font Size:</label>
    <select id="fontSize" name="fontSize" class="form-input">
      <option value="x-small">Extra Small</option>
      <option value="small">Small</option>
      <option value="normal">Normal</option>
      <option value="large">Large</option>
      <option value="x-large">Extra Larger</option>
    </select>
  </div>
</div>

<template id="spModalTemplate">
  {% include 'superprod/modal.html' %}
</template>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    let fontSize = "normal";
    let listStyle = "disc";

    if (loadPluginSettings) {
      document.getElementById('title').value = pluginSettings.title || '';
      fontSize = pluginSettings.fontSize;
      listStyle = pluginSettings.listStyle;
    }

    document.getElementById('fontSize').value = fontSize;
    document.getElementById('listStyle').value = listStyle;
  });

  const frame_div = document.querySelector(".frame")
  const modal = document.createElement('div');
  modal.classList.add('modal');
  modal.id = 'spModal';

  const modalTemplate = document.getElementById('spModalTemplate');
  modal.appendChild(modalTemplate.content.cloneNode(true));
  frame_div.appendChild(modal);

  async function getState(forceCheck = false) {
    try {
      const response = await fetch(
        "{{ url_for('main.execute_command') }}",
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            plugin_id: '{{ plugin.id }}',
            method: 'sp.get_state',
            args: JSON.stringify({ force_check: forceCheck ? 'True' : 'False' }),
          })
        }
      );

      const result = await response.json();
      if (response.ok) {
        document.getElementById('state').innerHTML = result.result;
        if (result.result === 'LOGGED_OFF') {
          document.getElementById('spLogin').style.display = 'flex';
          document.getElementById('spEncryption').style.display = 'none';
        } else if (result.result === 'ENCRYPTED') {
          document.getElementById('spLogin').style.display = 'none';
          document.getElementById('spEncryption').style.display = 'flex';
        } else{
          document.getElementById('spLogin').style.display = 'none';
          document.getElementById('spEncryption').style.display = 'none';
        }
      } else {
        showResponseModal('failure', `Error!  ${result.error}`);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while processing your request.');
    }
  }

  async function getLink() {
    try {
      const response = await fetch(
        "{{ url_for('main.execute_command') }}",
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            plugin_id: '{{ plugin.id }}',
            method: 'sp.get_login_link'
          })
        }
      );

      const result = await response.json();
      if (response.ok) {
        if (result.result !== null){
          window.open(result.result, '_blank');
        }
      } else {
        showResponseModal('failure', `Error!  ${result.error}`);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while processing your request.');
    }
  }

  async function saveLoginCode() {
    try {
      const response = await fetch(
        "{{ url_for('main.execute_command') }}",
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            plugin_id: '{{ plugin.id }}',
            method: 'sp.send_login_token',
            args: JSON.stringify({ token: document.getElementById('loginCode').value }),
          })
        }
      );

      const result = await response.json();
      if (response.ok) {
        await getState();
      } else {
        showResponseModal('failure', `Error!  ${result.error}`);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while processing your request.');
    }
  }

  async function saveEncryptionKey() {
    try {
      const response = await fetch(
        "{{ url_for('main.execute_command') }}",
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            plugin_id: '{{ plugin.id }}',
            method: 'sp.send_encryption_key',
            args: JSON.stringify({ key: document.getElementById('encryptionKey').value }),
          })
        }
      );

      const result = await response.json();
      if (response.ok) {
        await getState();
      } else {
        showResponseModal('failure', `Error!  ${result.error}`);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while processing your request.');
    }
  }

</script>
